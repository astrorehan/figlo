<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; }
  body { font: 12px/1.4 Inter, system-ui, sans-serif; margin: 0; padding: 12px; color: var(--figma-color-text, #222); background: var(--figma-color-bg, #fff); }
  button { width: 100%; padding: 8px; border: 0; border-radius: 6px; font-weight: 600; cursor: pointer;
    background: var(--figma-color-bg-brand, #0d99ff); color: var(--figma-color-text-onbrand, #fff); }
  button:disabled { opacity: .5; cursor: default; }
  #sel { margin-bottom: 8px; min-height: 17px; }
  #code { font: 700 28px/1 ui-monospace, Consolas, monospace; letter-spacing: 4px; text-align: center; padding: 14px 0 6px; user-select: all; }
  #status { color: var(--figma-color-text-secondary, #666); min-height: 34px; white-space: pre-wrap; }
  .err { color: var(--figma-color-text-danger, #d22) !important; }
  #copy { background: var(--figma-color-bg-secondary, #eee); color: inherit; margin-top: 4px; display: none; }
  .tabs { display: flex; gap: 4px; margin: -4px 0 12px; }
  .tabs button { background: var(--figma-color-bg-secondary, #eee); color: inherit; padding: 6px; }
  .tabs button.on { background: var(--figma-color-bg-brand, #0d99ff); color: var(--figma-color-text-onbrand, #fff); }
  .page { display: none; } .page.on { display: block; }
  #fxsel { margin-bottom: 8px; color: var(--figma-color-text-secondary, #666); word-break: break-all; }
  .fx { border: 1px solid var(--figma-color-border, #ddd); border-radius: 6px; padding: 8px; margin-bottom: 6px; }
  .fx .head { display: flex; align-items: center; gap: 8px; }
  .fx .chip { width: auto; padding: 4px 10px; font-family: ui-monospace, Consolas, monospace;
    background: var(--figma-color-bg-secondary, #eee); color: inherit; }
  .fx.on .chip { background: var(--figma-color-bg-brand, #0d99ff); color: var(--figma-color-text-onbrand, #fff); }
  .fx .hint { color: var(--figma-color-text-secondary, #666); flex: 1; }
  .fx .params { display: none; margin-top: 8px; }
  .fx.on .params { display: block; }
  .param { display: grid; grid-template-columns: 1fr 64px; gap: 2px 6px; margin-bottom: 6px; align-items: center; }
  .param label { grid-column: 1 / 3; }
  .param input[type=number], .param input[type=text] { width: 100%; box-sizing: border-box; font: inherit; padding: 2px 4px;
    background: var(--figma-color-bg, #fff); color: inherit; border: 1px solid var(--figma-color-border, #ccc); border-radius: 4px; }
  .param input[type=text] { grid-column: 1 / 3; }
  .reset { width: auto; padding: 2px 8px; font-weight: 400; background: none; color: var(--figma-color-text-secondary, #666); }
    .guide-intro { margin: 0 0 10px; color: var(--figma-color-text-secondary, #666); }
  .guide-filters { display: grid; grid-template-columns: 1fr 112px; gap: 6px; }
  .guide-filters input, .guide-filters select, #guideValue {
    min-width: 0; width: 100%; box-sizing: border-box; font: inherit; color: inherit;
    background: var(--figma-color-bg, #fff); border: 1px solid var(--figma-color-border, #ddd); border-radius: 6px; padding: 7px;
  }
  #guideList { display: flex; flex-wrap: wrap; gap: 5px; max-height: 98px; overflow-y: auto; padding: 9px 1px; }
  #guideList button { width: auto; padding: 5px 9px; font: 11px ui-monospace, Consolas, monospace; background: var(--figma-color-bg-secondary, #eee); color: inherit; }
  #guideList button[aria-pressed=true] { background: var(--figma-color-bg-brand, #0d99ff); color: var(--figma-color-text-onbrand, #fff); }
  #guideEmpty { padding: 16px 0; color: var(--figma-color-text-secondary, #666); }
  .guide-heading { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
  .guide-heading h2 { font: 600 18px ui-monospace, Consolas, monospace; margin: 0; }
  #guideGroup { font-size: 10px; color: var(--figma-color-text-secondary, #666); border: 1px solid var(--figma-color-border, #ddd); border-radius: 20px; padding: 3px 8px; }
  #guideDescription { margin: 7px 0 9px; min-height: 32px; }
  .guide-example { display: flex; gap: 8px; align-items: center; justify-content: space-between; padding: 7px 9px; background: var(--figma-color-bg-secondary, #eee); border-radius: 6px; }
  .guide-example code { overflow-wrap: anywhere; }
  button.guide-secondary { width: auto; background: var(--figma-color-bg-secondary, #eee); color: inherit; font-size: 11px; padding: 5px 8px; }
  .guide-preview-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  #guidePreviewTitle { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #guideStage { height: 240px; margin-top: 8px; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; border: 1px solid var(--figma-color-border, #ddd); border-radius: 8px; background-color: var(--figma-color-bg-secondary, #f5f5f5); background-image: radial-gradient(circle, rgb(128 128 128 / 16%) .8px, transparent 1px); background-size: 14px 14px; }
  .guide-placeholder { max-width: 280px; padding: 16px; text-align: center; color: #aabed3; }
  .guide-toolbar { display: flex; gap: 5px; align-items: center; margin-top: 6px; }
  #guideInstruction { flex: 1; color: var(--figma-color-text-secondary, #666); font-size: 11px; }
  .guide-note { font-size: 10px; margin: 5px 0 10px; color: var(--figma-color-text-secondary, #777); }
  #guideValueRow label { display: block; margin-bottom: 4px; }
  #guideSettings { border: 1px solid var(--figma-color-border, #ddd); border-radius: 6px; margin-top: 8px; padding: 8px; }
  #guideSettings summary { cursor: pointer; font-weight: 600; }
  #guideParams { margin-top: 8px; }
  #guideParams .param output { text-align: right; font: 11px ui-monospace, monospace; }
  #guideParams input[type=range] { width: 100%; margin: 0; accent-color: #0d99ff; }
  #guidePlacement { margin: 10px 0 8px; color: var(--figma-color-text-secondary, #666); font-size: 11px; }
  #guideSelection { margin: 6px 0; color: var(--figma-color-text-secondary, #666); font-size: 11px; overflow-wrap: anywhere; }
  .preview-viewport { position: relative; flex: none; }
  .preview-world { position: absolute; top: 0; left: 0; transform-origin: top left; }
  .preview-node { position: absolute; transform-origin: center; pointer-events: none; box-sizing: border-box; }
  .preview-node[data-button] { cursor: pointer; touch-action: manipulation; }
  .preview-node:focus-visible { outline: 2px solid #0d99ff; outline-offset: 3px; }
  .preview-paint, .preview-image, .preview-band, .preview-splash { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; box-sizing: border-box; }
  .preview-paint { display: block; }
  .preview-text { display: block; width: 100%; height: 100%; overflow: hidden; }
  .preview-scroll-canvas { position: relative; pointer-events: none; }
  .preview-band, .preview-splash { overflow: hidden; }
  .preview-band::after { content: ''; position: absolute; top: -50%; height: 200%; width: var(--band-width, 32%); background: linear-gradient(90deg, transparent, #fff, transparent); opacity: var(--band-opacity, .6); transform: translateX(var(--band-x, -500%)) rotate(var(--band-angle, 20deg)); }
  .preview-ripple { position: absolute; width: 12px; height: 12px; margin: -6px; border-radius: 50%; }
  body.preview-expanded { height: 100vh; box-sizing: border-box; overflow: hidden; }
  .preview-expanded .tabs, .preview-expanded #pageGuide > :not(#guidePreviewPanel) { display: none; }
  .preview-expanded #pageGuide, .preview-expanded #guidePreviewPanel { height: 100%; }
  .preview-expanded #guidePreviewPanel { display: flex; flex-direction: column; }
  .preview-expanded #guideStage { flex: 1; min-height: 0; height: auto; }
  .preview-expanded .guide-note { margin-bottom: 0; }
  @media (prefers-reduced-motion: reduce) { #guideStage * { scroll-behavior: auto; transition-duration: 0s !important; } }

</style>
</head>
<body>
  <div class="tabs" role="tablist" aria-label="Figlo panels"><button id="tabExport" class="on" role="tab" aria-selected="true">Export</button><button id="tabFx" role="tab" aria-selected="false">Effects</button><button id="tabGuide" role="tab" aria-selected="false">Tag Guide</button></div>
  <div id="pageExport" class="page on">
    <div id="sel">…</div>
    <label for="token">Relay pairing token</label>
    <input id="token" type="password" autocomplete="off" spellcheck="false" placeholder="Paste token from relay terminal" style="width:100%;box-sizing:border-box;margin:4px 0 10px;padding:8px">
    <button id="go">Export to Roblox</button>
    <button id="demo" style="margin-top:8px;background:var(--figma-color-bg-secondary,#eee);color:inherit">Create demo frame</button>
    <div id="code"></div>
    <button id="copy">Copy code</button>
    <div id="status"></div>
  </div>
  <div id="pageFx" class="page">
    <div id="fxsel">Select layer(s), then tap a tag to add or remove it.</div>
    <div id="fxlist"></div>
  </div>
  <div id="pageGuide" class="page">
    <section id="guidePreviewPanel" aria-label="UI preview">
      <div class="guide-preview-heading"><strong id="guidePreviewTitle">UI preview</strong><button id="guideMaximize" class="guide-secondary" aria-expanded="false">Maximize</button></div>
      <div id="guideStage" aria-label="Interactive UI preview"></div>
      <div class="guide-toolbar"><span id="guideInstruction">Hover or click the UI</span><button id="guideRefresh" class="guide-secondary">Refresh</button><button id="guideReplay" class="guide-secondary">Replay</button><button id="guidePause" class="guide-secondary">Pause</button></div>
      <p id="guideNote" class="guide-note">Select a panel to interact with its tagged children.</p>
    </section>
    <p class="guide-intro">Find a tag. Add it to a layer to use it in your UI.</p>
    <div class="guide-filters"><input id="guideSearch" type="search" placeholder="Search tags" aria-label="Search tags"><select id="guideCategory" aria-label="Tag category"><option value="">All tags</option></select></div>
    <div id="guideList" aria-label="Tags"></div>
    <div id="guideEmpty" hidden>No tags found. Try another search.</div>
    <section id="guideDetail">
      <div class="guide-heading"><h2 id="guideTitle"></h2><span id="guideGroup"></span></div>
      <p id="guideDescription"></p>
      <div class="guide-example"><code id="guideExample"></code><button id="guideCopy" class="guide-secondary">Copy</button></div>
      <div id="guideValueRow" hidden><label id="guideValueLabel" for="guideValue"></label><input id="guideValue" type="text" maxlength="80"></div>
      <details id="guideSettings"><summary>Preview settings</summary><p id="guideSettingsNote" class="guide-note"></p><div id="guideParams"></div><button id="guideReset" class="guide-secondary">Reset defaults</button></details>
      <p id="guidePlacement"></p>
      <button id="guideApply" disabled>Add to selected layer</button>
      <div id="guideSelection" role="status" aria-live="polite">Select a layer to add this tag.</div>
    </section>
  </div>
<script>
const RELAY = 'http://localhost:34880';
const MAX_IMAGE = 1024;
const $ = id => document.getElementById(id);
$('demo').onclick = () => parent.postMessage({ pluginMessage: { type: 'create-demo' } }, '*');
let selectionOk = false;

function status(text, isError) {
  $('status').textContent = text;
  $('status').className = isError ? 'err' : '';
}

async function relayUp() {
  try { return (await fetch(RELAY + '/ping')).ok; } catch { return false; }
}

// Decode PNG/JPEG/GIF bytes to straight RGBA, capped at MAX_IMAGE on the long side.
async function toRGBA(bytes) {
  const bmp = await createImageBitmap(new Blob([bytes]), { premultiplyAlpha: 'none', colorSpaceConversion: 'none' });
  const s = Math.min(1, MAX_IMAGE / Math.max(bmp.width, bmp.height));
  const w = Math.max(1, Math.round(bmp.width * s)), h = Math.max(1, Math.round(bmp.height * s));
  const canvas = new OffscreenCanvas(w, h);
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(bmp, 0, 0, w, h);
  return { w, h, data: ctx.getImageData(0, 0, w, h).data };
}

async function push(ir, images) {
  const decoded = [];
  for (let i = 0; i < images.length; i++) {
    status(`Decoding image ${i + 1}/${images.length}…`);
    const im = images[i];
    const px = await toRGBA(im.bytes);
    decoded.push({ key: im.key, w: px.w, h: px.h, nw: im.nw, nh: im.nh, data: px.data });
  }
  const head = new TextEncoder().encode(JSON.stringify({
    ir, images: decoded.map(d => ({ key: d.key, w: d.w, h: d.h, nw: d.nw, nh: d.nh })),
  }));
  const total = 8 + head.length + decoded.reduce((n, d) => n + d.data.length, 0);
  const buf = new Uint8Array(total);
  buf.set(new TextEncoder().encode('FFP1'));
  new DataView(buf.buffer).setUint32(4, head.length, true);
  buf.set(head, 8);
  let off = 8 + head.length;
  for (const d of decoded) { buf.set(d.data, off); off += d.data.length; }
  status('Sending to relay…');
  const token = $('token').value.trim();
  if (!token) throw new Error('Paste the relay pairing token first.');
  const res = await fetch(RELAY + '/push', { method: 'POST', headers: { Authorization: 'Bearer ' + token }, body: buf });
  const out = await res.json();
  if (!res.ok) throw new Error(out.error || res.statusText);
  return out.code;
}

$('go').onclick = async () => {
  if (!$('token').value.trim()) { status('Paste the relay pairing token first.', true); return; }
  $('go').disabled = true;
  $('code').textContent = '';
  $('copy').style.display = 'none';
  if (!(await relayUp())) {
    status('Relay is not running. Start it with relay\\start.cmd, then try again.', true);
    $('go').disabled = !selectionOk;
    return;
  }
  parent.postMessage({ pluginMessage: { type: 'export' } }, '*');
};

$('copy').onclick = async () => {
  const code = $('code').textContent;
  try { await navigator.clipboard.writeText(code); } catch {
    const t = document.createElement('textarea'); t.value = code; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove();
  }
  $('copy').textContent = 'Copied';
  setTimeout(() => $('copy').textContent = 'Copy code', 1200);
};

// --- Effects tab ---
function showTab(name) {
  for (const key of ['Export', 'Fx', 'Guide']) {
    const active = key === name;
    $('tab' + key).className = active ? 'on' : '';
    $('tab' + key).setAttribute('aria-selected', String(active));
    $('tab' + key).tabIndex = active ? 0 : -1;
    $('page' + key).className = 'page' + (active ? ' on' : '');
  }
  window.FigloGuide?.setVisible(name === 'Guide');
}
$('tabExport').onclick = () => showTab('Export');
$('tabFx').onclick = () => showTab('Fx');
$('tabGuide').onclick = () => showTab('Guide');
for (const key of ['Export', 'Fx', 'Guide']) {
  $('tab' + key).tabIndex = key === 'Export' ? 0 : -1;
  $('tab' + key).onkeydown = e => {
    const tabs = ['Export', 'Fx', 'Guide'], index = tabs.indexOf(key);
    const next = e.key === 'ArrowRight' ? (index + 1) % 3 : e.key === 'ArrowLeft' ? (index + 2) % 3 : e.key === 'Home' ? 0 : e.key === 'End' ? 2 : -1;
    if (next < 0) return;
    e.preventDefault(); showTab(tabs[next]); $('tab' + tabs[next]).focus();
  };
}

let fxSpec = null;
const send = m => parent.postMessage({ pluginMessage: m }, '*');

function buildFxList(spec) {
  fxSpec = spec;
  const list = $('fxlist');
  list.textContent = '';
  for (const [tag, def] of Object.entries(spec)) {
    const box = document.createElement('div');
    box.className = 'fx';
    box.id = 'fx-' + tag;
    const head = document.createElement('div');
    head.className = 'head';
    const chip = document.createElement('button');
    chip.className = 'chip';
    chip.textContent = '_' + tag;
    chip.onclick = () => send({ type: 'fx-toggle', tag });
    const hint = document.createElement('div');
    hint.className = 'hint';
    hint.textContent = def.hint;
    head.append(chip, hint);
    const params = document.createElement('div');
    params.className = 'params';
    if (def.value) {
      const row = document.createElement('div');
      row.className = 'param';
      const label = document.createElement('label');
      label.textContent = def.value;
      const input = document.createElement('input');
      input.type = 'text';
      input.placeholder = 'none';
      input.dataset.value = '1';
      input.onchange = () => send({ type: 'fx-value', tag, value: input.value.trim() });
      row.append(label, input);
      params.append(row);
    }
    for (const [key, p] of Object.entries(def.params)) {
      const row = document.createElement('div');
      row.className = 'param';
      const label = document.createElement('label');
      label.textContent = p.label;
      row.append(label);
      if (p.type === 'text') {
        const input = document.createElement('input');
        input.type = 'text';
        input.placeholder = 'none';
        input.dataset.key = key;
        input.onchange = () => send({ type: 'fx-set', tag, key, value: input.value.trim() });
        row.append(input);
      } else {
        const range = document.createElement('input');
        range.type = 'range';
        const num = document.createElement('input');
        num.type = 'number';
        for (const el of [range, num]) { el.min = p.min; el.max = p.max; el.step = p.step; el.dataset.key = key; }
        range.oninput = () => { num.value = range.value; };
        range.onchange = () => send({ type: 'fx-set', tag, key, value: Number(range.value) });
        num.onchange = () => { range.value = num.value; send({ type: 'fx-set', tag, key, value: Number(num.value) }); };
        row.append(range, num);
      }
      params.append(row);
    }
    if (Object.keys(def.params).length) {
      const reset = document.createElement('button');
      reset.className = 'reset';
      reset.textContent = 'Reset to defaults';
      reset.onclick = () => send({ type: 'fx-reset', tag });
      params.append(reset);
    }
    box.append(head, params);
    list.append(box);
  }
}

function showFxState(m) {
  $('fxsel').textContent = m.count === 0 ? 'Select layer(s), then tap a tag to add or remove it.'
    : m.count === 1 ? m.name : m.count + ' layers selected';
  if (!fxSpec) return;
  for (const tag of Object.keys(fxSpec)) {
    const box = $('fx-' + tag);
    const st = m.tags[tag];
    box.className = 'fx' + (st ? ' on' : '');
    box.querySelector('.chip').disabled = m.count === 0;
    if (!st) continue;
    for (const input of box.querySelectorAll('input')) {
      const v = input.dataset.value ? (st.value || '') : st.values[input.dataset.key];
      if (document.activeElement !== input) input.value = v;
    }
  }
}

onmessage = async e => {
  const m = e.data.pluginMessage;
  if (!m) return;
  if (m.type === 'effects') {
    buildFxList(m.spec);
    window.FigloGuide?.configure(m.spec, m.knownTags);
  } else if (m.type === 'fx-state') {
    showFxState(m);
    window.FigloGuide?.selection(m);
  } else if (m.type === 'guide-applied') {
    window.FigloGuide?.applied(m);
  } else if (m.type === 'guide-preview') {
    window.FigloGuide?.preview(m);
  } else if (m.type === 'guide-preview-dirty') {
    window.FigloGuide?.refresh();
  } else if (m.type === 'selection') {
    selectionOk = !m.error;
    $('sel').textContent = m.error || ('Selected: ' + m.name);
    $('sel').className = m.error ? 'err' : '';
    $('go').disabled = !selectionOk;
  } else if (m.type === 'progress') {
    status(m.message);
  } else if (m.type === 'error') {
    status(m.message, true);
    $('go').disabled = !selectionOk;
  } else if (m.type === 'payload') {
    try {
      const code = await push(m.ir, m.images);
      $('code').textContent = code;
      $('copy').style.display = 'block';
      const warn = m.ir.warnings.length ? `\n${m.ir.warnings.length} warning(s): ${m.ir.warnings.join('; ')}` : '';
      status(`${m.images.length} images. Paste the code in the Figlo Studio plugin.${warn}`);
    } catch (err) {
      status('Push failed: ' + err.message, true);
    }
    $('go').disabled = !selectionOk;
  }
};

parent.postMessage({ pluginMessage: { type: 'selection?' } }, '*');
</script>
<script>
(() => {
  const TAU = Math.PI * 2;
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const pointerTags = ['lift', 'tip', 'pull', 'sheen', 'splash'];
  const clockTags = new Set(['spin', 'rays', 'pulse', 'float', 'sway', 'wobble', 'blink', 'wiggle', 'jitter', 'halo', 'tide', 'drift', 'shiny', 'gleam', 'sheen', 'splash', 'pop', 'fade', 'slide', 'stagger']);
  // Effects compose on a node, as the runtime's scale/offset/rotation channels do.
  function motion(node, fx, t, state, point, age, parentSize) {
    let x = 0, y = 0, angle = node.rot || 0, sx = 1, sy = 1, opacity = node.opacity ?? 1;
    const hovered = state === 'hover' || state === 'press', pressed = state === 'press';
    for (const [tag, v] of Object.entries(fx)) {
      const wave = Math.sin(t * TAU * (v.rate || 1));
      if (tag === 'smooth') sx *= pressed ? v.press : hovered ? v.hover : 1;
      if (tag === 'spin') angle += t * v.speed;
      if (tag === 'rays') { angle += node.pw > node.ph * 2 ? Math.sin(t * .8) * 4 : t * v.speed; sx *= 1 + wave * v.amp; }
      if (tag === 'pulse') sx *= 1 + wave * v.amp;
      if (tag === 'float') y -= wave * v.amp * node.ph;
      if (tag === 'sway') angle += wave * v.angle;
      if (tag === 'wobble' && node.kind !== 'text') { sx *= 1 + wave * v.amp; sy *= 1 - wave * v.amp; }
      if (tag === 'blink') { const beat = Math.pow(.5 + .5 * Math.cos(t * TAU * v.rate), .6); sx *= v.min + (1 - v.min) * beat; if (node.kind === 'image') opacity *= 1 - v.fade * (1 - beat); }
      if (tag === 'wiggle' || tag === 'jitter') {
        const every = Math.max(.1, v.every), duration = Math.min(every, v.time), phase = t % every;
        if (phase < duration) {
          const u = phase / duration;
          if (tag === 'wiggle') angle += v.angle * Math.exp(-4 * u) * Math.sin(u * TAU * 3);
          else { x += Math.sin(phase * 97) * v.amount * node.ph * (1 - u); y += Math.cos(phase * 71) * v.amount * node.ph * (1 - u); }
        }
      }
      if (tag === 'lift' && hovered) y -= v.amount * node.ph;
      if (tag === 'tip' && hovered) angle += clamp(point.x * 2, -1, 1) * v.angle;
      if (tag === 'pull' && hovered) { x += point.x * point.w * v.strength; y += point.y * point.h * v.strength; }
      if (tag === 'pop') { const p = clamp(age / v.time, 0, 1); sx *= v.from + (1 - v.from) * (1 - Math.pow(1 - p, 3) + Math.sin(p * Math.PI) * .15); }
      if (tag === 'fade') opacity *= 1 - Math.pow(1 - clamp(age / v.time, 0, 1), 3);
      if (tag === 'slide') { const d = v.distance * Math.pow(1 - clamp(age / v.time, 0, 1), 5), a = v.angle * Math.PI / 180; x += Math.sin(a) * d * parentSize.w; y -= Math.cos(a) * d * parentSize.h; }

  let previewError = '', previewTimer = 0, requestId = 0, sceneData = null;
  const valueDefaults = { when: 'hover', goto: 'Details', show: 'Details', hide: '', switch: 'Details' };
  for (const category of Object.keys(groups)) { const option = make('option', '', category); option.value = category; el('guideCategory').append(option); }

  function description(entry) { return descriptions[entry.tag] || spec[entry.tag]?.hint || 'Changes how this layer is imported.'; }
  function list() {
    const query = el('guideSearch').value.trim().toLowerCase(), category = el('guideCategory').value;
    const matches = catalogue.filter(e => (known.has(e.tag) || e.tag === '#') && (!category || e.category === category)
      && (!query || [e.tag, e.category, e.example, e.placement, description(e)].join(' ').toLowerCase().includes(query)));
    el('guideList').replaceChildren();
    el('guideEmpty').hidden = matches.length !== 0;
    el('guideDetail').hidden = matches.length === 0;
    if (!matches.length) return;
    if (!matches.some(e => e.tag === selected)) choose(matches[0].tag);
    for (const entry of matches) {
      const button = make('button', '', entry.tag === '#' ? '# prefix' : '_' + entry.tag);
      button.setAttribute('aria-pressed', String(entry.tag === selected));
      button.onclick = () => { choose(entry.tag); list(); };
      el('guideList').append(button);
    }
  }

  function example() {
    const entry = catalogue.find(e => e.tag === selected);
    const value = el('guideValue').value.trim();
    const parts = selection.count === 1 ? selection.name.split('_') : [entry.example.split('_')[0]];
    while (parts.length > 1 && known.has(parts.at(-1).split(':')[0].toLowerCase())) parts.pop();
    const base = parts.join('_').replace(/^#/, '');
    el('guideExample').textContent = selected === '#' ? '#' + base : base + '_' + selected + (spec[selected]?.value && value ? ':' + value : '');
  }
  function params() {
    el('guideParams').replaceChildren();
    const definitions = spec[selected]?.params || {};
    el('guideSettings').hidden = !Object.keys(definitions).length;
    for (const [key, p] of Object.entries(definitions)) {
      const row = make('div', 'param'), label = make('label', '', p.label), input = make('input');
      input.id = 'guide-param-' + key; label.htmlFor = input.id;
      input.disabled = !matchingNodes(selected).length;
      input.type = p.type === 'text' ? 'text' : 'range'; input.value = values[key];
      row.append(label, input);
      if (p.type !== 'text') {
        input.min = p.min; input.max = p.max; input.step = p.step;
        input.value = values[key];
        const output = make('output', '', values[key]); output.htmlFor = input.id; row.append(output);
        input.oninput = () => { values[key] = Number(input.value); output.value = input.value; preview?.updateTag(selected, values); };
      } else {
        input.oninput = () => { values[key] = input.value; preview?.updateTag(selected, values); };
        if (/Sound$/.test(key)) {
          input.title = 'Saved when applied. Audio is not played in this preview.';
          row.append(make('small', '', 'Audio plays in Roblox, not in this preview.'));
        }
      }
      el('guideParams').append(row);
    }
  }

  function matchingNodes(tag) {
    const out = [];
    function visit(n) { if (n.tags?.[tag]) out.push(n); for (const c of n.children || []) visit(c); }
    if (sceneData) visit(sceneData.ir.root);
    return out;
  }
  function choose(tag) {
    selected = tag;
    const entry = catalogue.find(e => e.tag === tag), first = matchingNodes(tag)[0];
    values = Object.fromEntries(Object.entries(spec[tag]?.params || {}).map(([k, p]) => [k, preview?.tagValues(tag)?.[k] ?? first?.fx?.[tag]?.[k] ?? p.def]));
    el('guideTitle').textContent = tag === '#' ? '# prefix' : '_' + tag;
    el('guideGroup').textContent = entry.category;
    el('guideDescription').textContent = description(entry);
    el('guidePlacement').textContent = entry.placement;
    el('guideValueRow').hidden = !spec[tag]?.value;
    el('guideValueLabel').textContent = spec[tag]?.value || '';
    el('guideValue').value = typeof first?.tags[tag] === 'string' ? first.tags[tag] : valueDefaults[tag] ?? '';
    example(); params(); updateSelection();
    const matches = matchingNodes(tag);
    for (const input of el('guideParams').querySelectorAll('input')) input.disabled = !matches.length;
    el('guideSettingsNote').textContent = matches.length ? 'Preview settings for ' + matches.length + (matches.length === 1 ? ' tagged layer.' : ' tagged layers.') : 'No layer in this frame has this tag yet.';
    el('guideReset').disabled = !matches.length;
  }
  function clearScene() {
    preview?.destroy(); preview = null;
    for (const asset of assets.values()) URL.revokeObjectURL(asset.url);
    assets = new Map(); sceneData = null;
  }
  function placeholder() {
    const stage = el('guideStage'); stage.replaceChildren();
    const message = previewError || (selection.count === 1 ? 'Loading selected UI…' : selection.count > 1 ? 'Select one frame to preview its UI.' : 'Select a frame to preview its UI.');
    stage.append(make('p', 'guide-placeholder', message)); stage.setAttribute('aria-busy', String(selection.count === 1 && !previewError));
    el('guideNote').textContent = 'Select a panel to interact with its tagged children.';
  }
  function refresh() {
    clearTimeout(previewTimer);
    const next = ++requestId;
    if (!visible || selection.count !== 1) return;
    previewTimer = setTimeout(() => parent.postMessage({ pluginMessage: { type: 'guide-preview', requestId: next, id: selection.id } }, '*'), 160);
  }
  function pauseLabel() { el('guidePause').textContent = playing ? 'Pause' : 'Play'; el('guidePause').setAttribute('aria-pressed', String(!playing)); }
  function maximize(value) {
    if (value) savedScroll = scrollY;
    expanded = value; document.body.classList.toggle('preview-expanded', expanded);
    el('guideMaximize').textContent = expanded ? 'Back to guide' : 'Maximize';
    el('guideMaximize').setAttribute('aria-expanded', String(expanded));
    parent.postMessage({ pluginMessage: { type: 'guide-resize', expanded, width: Math.max(400, screen.availWidth - 160), height: Math.max(480, screen.availHeight - 160) } }, '*');
    preview?.fit();
    window.scrollTo(0, value ? 0 : savedScroll);
  }

  function updateSelection() {
    const has = selection.tags[selected]?.count === selection.count && selection.count > 0;
    el('guideApply').disabled = !selection.count || !Object.keys(spec).length;
    el('guideApply').textContent = (has ? 'Update' : 'Add to') + (selection.count > 1 ? ' ' + selection.count + ' selected layers' : ' selected layer');
    el('guideSelection').className = '';
    el('guideSelection').textContent = !selection.count ? 'Select a layer to add this tag.' : selection.count === 1 ? selection.name : selection.count + ' layers selected';
  }
  el('guideSearch').oninput = list; el('guideCategory').onchange = list;
  el('guideValue').oninput = example;
  el('guidePause').onclick = () => { playing = !playing; pauseLabel(); preview?.play(playing); };
  el('guideReplay').onclick = () => { if (!preview) { refresh(); return; } preview.replay(); el('guideNote').textContent = 'Preview: ' + selection.name; };
  el('guideRefresh').onclick = refresh;
  el('guideMaximize').onclick = () => maximize(!expanded);
  document.addEventListener('keydown', e => { if (expanded && e.key === 'Escape') { e.preventDefault(); maximize(false); el('guideMaximize').focus(); } });
  el('guideReset').onclick = () => { values = Object.fromEntries(Object.entries(spec[selected]?.params || {}).map(([k, p]) => [k, p.def])); params(); preview?.updateTag(selected, values); };
  el('guideApply').onclick = () => parent.postMessage({ pluginMessage: { type: 'guide-apply', tag: selected, value: el('guideValue').value.trim(), params: { ...values } } }, '*');
  el('guideCopy').onclick = async () => {
    const value = el('guideExample').textContent;
    try { await navigator.clipboard.writeText(value); } catch { const t = make('textarea'); t.value = value; document.body.append(t); t.select(); document.execCommand('copy'); t.remove(); }
    el('guideCopy').textContent = 'Copied'; setTimeout(() => { el('guideCopy').textContent = 'Copy'; }, 1000);
  };
  window.addEventListener('unload', () => { clearTimeout(previewTimer); clearScene(); });
  document.addEventListener('visibilitychange', () => preview?.setVisible(visible && !document.hidden));
  window.FigloGuide = {
    configure(definitions, tags) { spec = definitions; known = new Set(tags || Object.keys(spec)); choose(selected); list(); pauseLabel(); },
    selection(message) {
      const changed = message.id !== selection.id || message.count !== selection.count;
      selection = message; updateSelection(); example();
      if (changed) { clearScene(); previewError = ''; placeholder(); choose(selected); }
      refresh();
    },
    refresh,
    async preview(message) {
      const current = () => visible && message.requestId === requestId && message.id === selection.id && selection.count === 1;
      if (!current()) return;
      if (message.error) { clearScene(); previewError = message.error; placeholder(); choose(selected); return; }
      const nextAssets = new Map();
      try {
        for (const item of message.images || []) {
          const url = URL.createObjectURL(new Blob([new Uint8Array(item.bytes)], { type: 'image/png' }));
          const img = new Image(); img.src = url; nextAssets.set(item.key, { url, w: 1, h: 1 });
          await img.decode(); nextAssets.set(item.key, { url, w: img.naturalWidth, h: img.naturalHeight });
          if (!current()) break;
        }
      } catch {
        for (const a of nextAssets.values()) URL.revokeObjectURL(a.url);
        if (!current()) return;
        clearScene(); previewError = 'Could not load the preview images. Use Refresh to try again.'; placeholder(); return;
      }
      if (!current()) { for (const a of nextAssets.values()) URL.revokeObjectURL(a.url); return; }
      clearScene(); assets = nextAssets; sceneData = message; previewError = '';
      preview = window.FigloPreview.mount(el('guideStage'), message.ir, assets, spec, text => { el('guideNote').textContent = text; });
      preview.play(playing); el('guideStage').setAttribute('aria-busy', 'false');
      el('guideNote').textContent = message.ir.warnings?.length ? message.ir.warnings.join(' · ') : 'Preview: ' + message.name;
      choose(selected); el('guidePreviewTitle').textContent = message.name;
    },
    applied(message) { el('guideSelection').textContent = message.error || 'Applied to ' + message.count + (message.count === 1 ? ' layer.' : ' layers.'); el('guideSelection').className = message.error ? 'err' : ''; },
    setVisible(value) { visible = value; preview?.setVisible(value); if (visible) { if (!preview) placeholder(); refresh(); } else { clearTimeout(previewTimer); ++requestId; parent.postMessage({ pluginMessage: { type: 'guide-preview-cancel' } }, '*'); if (expanded) maximize(false); } },
  };
})();

</script>
</body>
</html>
