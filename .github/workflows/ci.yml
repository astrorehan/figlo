name: Check and build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.10
      - name: Install Rokit (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          gh release download v1.2.0 --repo rojo-rbx/rokit --pattern rokit-1.2.0-linux-x86_64.zip --dir "$RUNNER_TEMP/rokit"
          unzip "$RUNNER_TEMP/rokit/rokit-1.2.0-linux-x86_64.zip" -d "$RUNNER_TEMP/rokit/bin"
          chmod +x "$RUNNER_TEMP/rokit/bin/rokit"
          echo "$RUNNER_TEMP/rokit/bin" >> "$GITHUB_PATH"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Install Rokit (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          gh release download v1.2.0 --repo rojo-rbx/rokit --pattern rokit-1.2.0-windows-x86_64.zip --dir "$env:RUNNER_TEMP/rokit"
          Expand-Archive -LiteralPath "$env:RUNNER_TEMP/rokit/rokit-1.2.0-windows-x86_64.zip" -DestinationPath "$env:RUNNER_TEMP/rokit/bin"
          "$env:RUNNER_TEMP/rokit/bin" | Out-File -FilePath $env:GITHUB_PATH -Append
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Install pinned tools
        shell: bash
        run: |
          # Authenticated requests avoid GitHub's anonymous API rate limit (HTTP 403).
          rokit authenticate github --token "$GH_TOKEN" --skip-verify
          rokit install --no-trust-check
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Add pinned tool shims (Linux)
        if: runner.os == 'Linux'
        run: echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"
      - name: Add pinned tool shims (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"$env:USERPROFILE/.rokit/bin" | Out-File -FilePath $env:GITHUB_PATH -Append'
      - run: bun run check
      - run: bun run build
      - name: Require reproducible generated files
        run: git diff --exit-code -- figma/plugin/code.js samples/demo.ir.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Figlo-${{ runner.os }}
          path: |
            build/Figlo.rbxm
            out/figlo-page.min.js
            figma/plugin/code.js
